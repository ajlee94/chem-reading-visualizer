<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>化學閱讀視覺化｜雲端版</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230078d4'/%3E%3Cpath d='M19 17h26v7l-9 13v10l-8 4V37L19 24z' fill='white'/%3E%3C/svg%3E" type="image/svg+xml" />
  <style>
    :root {
      color-scheme: light;
      --ink: #17212b;
      --muted: #667085;
      --line: #d8dee8;
      --paper: #f5f7fb;
      --surface: #ffffff;
      --blue: #2563eb;
      --blue-soft: #e8f0ff;
      --green: #138a62;
      --green-soft: #e7f8f1;
      --amber: #b7791f;
      --amber-soft: #fff6dc;
      --shadow: 0 14px 34px rgba(15, 23, 42, 0.08);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--paper); color: var(--ink); font-family: Inter, "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
    button { font: inherit; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 18px;
      border-bottom: 1px solid rgba(216, 222, 232, 0.86);
      background: rgba(255, 255, 255, 0.92);
    }
    .brand strong { display: block; font-size: 17px; }
    .brand span, .sync-status { color: var(--muted); font-size: 12px; }
    .sync-status { padding: 7px 10px; border: 1px solid var(--line); border-radius: 999px; background: #fff; }
    .sync-status.online { color: var(--green); border-color: #a7dfca; background: var(--green-soft); }
    .sync-status.error { color: #b42318; border-color: #f2b8b5; background: #fff0ef; }
    .layout { display: grid; grid-template-columns: minmax(310px, 380px) minmax(0, 1fr); min-height: calc(100vh - 62px); }
    .route-panel { border-right: 1px solid var(--line); background: #f8fafc; overflow: auto; max-height: calc(100vh - 62px); position: sticky; top: 62px; }
    .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 14px; border-bottom: 1px solid var(--line); }
    .summary-card { padding: 10px; border-radius: 12px; background: #fff; box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05); }
    .summary-card span { display: block; color: var(--muted); font-size: 11px; }
    .summary-card strong { display: block; margin-top: 3px; font-size: 17px; }
    .week { border-bottom: 1px solid var(--line); }
    .week-head { padding: 11px 14px; background: #eef2f8; }
    .week-head strong { display: block; font-size: 13px; }
    .week-head span { color: var(--muted); font-size: 11px; }
    .node-row { display: block; border-top: 1px solid #e9edf3; background: #fff; }
    .node-button, .speaker-button { border: 0; background: transparent; color: inherit; cursor: pointer; }
    .node-button { width: 100%; min-width: 0; padding: 11px 12px; text-align: left; }
    .node-button:hover, .node-button.active { background: var(--blue-soft); box-shadow: inset 3px 0 0 var(--blue); }
    .node-button.completed { background: var(--green-soft); box-shadow: inset 3px 0 0 var(--green); }
    .node-title { display: block; font-weight: 750; font-size: 12.5px; line-height: 1.4; overflow-wrap: anywhere; }
    .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .tag { padding: 2px 6px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); background: #fff; font-size: 10px; }
    .tag.qa-pass { color: #315f9a; border-color: #b8cbea; background: #edf4ff; }
    .tag.pass { color: var(--green); border-color: #a7dfca; background: var(--green-soft); }
    .tag.locked { color: var(--amber); border-color: #ead29f; background: var(--amber-soft); }
    .speaker-button { display: grid; place-items: center; width: 48px; height: 48px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255, 255, 255, 0.96); font-size: 20px; box-shadow: 0 8px 22px rgba(15, 23, 42, 0.12); }
    .speaker-button:hover:not(:disabled), .speaker-button.playing { border-color: #9bb8f9; background: var(--blue-soft); }
    .speaker-button:disabled { cursor: not-allowed; color: #a8b0bd; background: rgba(244, 245, 247, 0.96); box-shadow: none; }
    .reader { padding: 22px; min-width: 0; }
    .reader-card { max-width: 1050px; margin: 0 auto; padding: 22px; border: 1px solid rgba(216, 222, 232, 0.9); border-radius: 20px; background: rgba(255, 255, 255, 0.92); box-shadow: var(--shadow); }
    .mobile-back-button { display: none; }
    .kicker { margin: 0; color: var(--blue); font-size: 12px; font-weight: 700; }
    h1 { margin: 8px 0 6px; font-size: clamp(22px, 3vw, 34px); line-height: 1.24; }
    .goal { margin: 0; color: var(--muted); line-height: 1.65; }
    .reader-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 16px 0; }
    .reader-tools button { min-height: 38px; padding: 8px 13px; border: 1px solid var(--line); border-radius: 10px; background: #fff; cursor: pointer; }
    .reader-tools button.primary { color: #fff; border-color: var(--blue); background: var(--blue); }
    .reader-tools button:disabled { cursor: not-allowed; opacity: 0.48; }
    .page-count { margin-left: auto; color: var(--muted); font-size: 12px; }
    .image-stage-shell { position: relative; }
    .reader-speaker-button { position: absolute; z-index: 3; top: 12px; right: 12px; }
    .image-stage { min-height: 420px; display: grid; place-items: center; padding: 14px; border: 1px solid var(--line); border-radius: 16px; background: #eef2f7; overflow: hidden; }
    .note-image { max-width: 100%; max-height: 78vh; object-fit: contain; border-radius: 8px; box-shadow: 0 12px 32px rgba(15, 23, 42, 0.16); }
    .empty { max-width: 520px; padding: 38px 22px; text-align: center; color: var(--muted); }
    .empty strong { display: block; margin-bottom: 8px; color: var(--ink); font-size: 18px; }
    .progress-track { height: 6px; margin-top: 12px; overflow: hidden; border-radius: 999px; background: #e5e7eb; }
    .progress-fill { height: 100%; width: 0; background: var(--blue); transition: width 160ms ease; }
    .offline-note { display: none; margin-top: 12px; padding: 10px 12px; border-radius: 10px; color: var(--amber); background: var(--amber-soft); font-size: 12px; }
    .offline-note.show { display: block; }
    @media (max-width: 900px) {
      .layout { display: block; min-height: calc(100vh - 58px); }
      .route-panel { display: block; position: static; max-height: none; overflow: visible; border-right: 0; border-bottom: 0; }
      .reader { display: none; padding: 12px; }
      .layout.mobile-reader-active .route-panel { display: none; }
      .layout.mobile-reader-active .reader { display: block; }
      .mobile-back-button { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; margin-bottom: 12px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--blue); cursor: pointer; font-weight: 700; }
      .reader-card { padding: 16px; border-radius: 14px; }
      .image-stage { min-height: 330px; padding: 8px; }
      .reader-speaker-button { top: 10px; right: 10px; }
    }
    @media (max-width: 520px) {
      .topbar { padding: 10px 12px; }
      .brand span { display: none; }
      .summary { padding: 10px; }
      .summary-card { padding: 8px; }
      .page-count { width: 100%; margin-left: 0; }
    }
  </style>

        <div class="image-stage-shell">

        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <div class="offline-note" id="offlineNote">目前使用本機暫存；雲端連線恢復後會重新同步。</div>
      </article>
    </main>

      const span = document.createElement("span");
      span.textContent = description;
      box.append(strong, span);
      return box;
    }

    function stopAudio() {
      if (activeAudio) {
        activeAudio.pause();
        activeAudio.currentTime = 0;
        activeAudio = null;
      }
      if (activeAudioButton) {
        activeAudioButton.classList.remove("playing");
        activeAudioButton.textContent = "🔊";
        activeAudioButton.setAttribute("aria-pressed", "false");
        activeAudioButton = null;
      }
    }

    function toggleAudio(node, button) {
      if (!node.audio || !node.audio.available) return;
      if (activeAudioButton === button && activeAudio && !activeAudio.paused) {
        stopAudio();
        return;
      }
      stopAudio();
      if (!node.audio.playbackUrl) {
        window.open(node.audio.previewUrl, "_blank", "noopener,noreferrer");
        return;
      }
      const audio = new Audio(node.audio.playbackUrl);
      audio.preload = "metadata";
      activeAudio = audio;
      activeAudioButton = button;
      button.classList.add("playing");
      button.textContent = "⏸";
      button.setAttribute("aria-pressed", "true");
      audio.addEventListener("ended", stopAudio, { once: true });
      audio.addEventListener("error", function () {
        const fallback = node.audio.previewUrl;
        stopAudio();
        if (fallback) window.open(fallback, "_blank", "noopener,noreferrer");
      }, { once: true });
      audio.play().catch(function () {
        const fallback = node.audio.previewUrl;
        stopAudio();
        if (fallback) window.open(fallback, "_blank", "noopener,noreferrer");
      });
    }
  </script>
</body>
</html>
