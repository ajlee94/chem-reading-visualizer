<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%234A4A4F'/%3E%3C/svg%3E">
  <title>化學閱讀</title>
  <style>
:root {
  --ink: #081d44;
  --muted: #667897;
  --line: #d7e2f1;
  --line-strong: #bdd0ea;
  --paper: #ffffff;
  --page: #f4f7fd;
  --page-soft: #edf4fb;
  --blue: #3267e8;
  --blue-deep: #1f50c8;
  --cyan: #2cbfd0;
  --teal: #159c83;
  --orange: #f28a31;
  --red: #e25757;
  --shadow: 0 14px 36px rgba(36, 72, 132, 0.09);
  --shadow-soft: 0 8px 20px rgba(36, 72, 132, 0.07);
  --radius-xl: 24px;
  --radius-lg: 18px;
  --radius-md: 14px;
  --route-weight-heading: 700;
  --route-weight-title: 650;
  --route-weight-meta: 600;
  --route-weight-chip: 750;
  --titanium-seed: #6C6C70;
  --titanium-primary: #4A4A4F;
  --titanium-on-primary: #FFFFFF;
  --titanium-primary-container: #D1D1D6;
  --titanium-on-primary-container: #1C1C1E;
  --titanium-secondary: #636366;
  --titanium-on-secondary: #FFFFFF;
  --titanium-secondary-container: #E5E5EA;
  --titanium-on-secondary-container: #2C2C2E;
  --titanium-tertiary: #52606D;
  --titanium-tertiary-container: #DCE4EA;
  --titanium-on-tertiary-container: #19242D;
  --titanium-surface: #F9F9FB;
  --titanium-surface-lowest: #FFFFFF;
  --titanium-surface-low: #F7F7F9;
  --titanium-surface-container: #F2F2F7;
  --titanium-surface-high: #E5E5EA;
  --titanium-on-surface: #1C1C1E;
  --titanium-on-surface-variant: #48484A;
  --titanium-outline: #8E8E93;
  --titanium-outline-variant: #C7C7CC;
  --route-ease: cubic-bezier(.2, 0, 0, 1);
  font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  color: var(--ink);
  background: var(--page);
}

* { box-sizing: border-box; }
html {
  min-height: 100%;
  background: var(--page);
  scrollbar-gutter: stable;
}
body { min-height: 100vh; margin: 0; color: var(--ink); background: var(--page); }
button, input, select { font: inherit; }
button { color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible {
  outline: 3px solid rgba(50, 103, 232, 0.22);
  outline-offset: 2px;
}

.preview-ribbon {
  position: fixed;
  inset: 0 0 auto 0;
  z-index: 40;
  height: 30px;
  display: grid;
  place-items: center;
  padding: 0 16px;
  color: #fff;
  background: linear-gradient(90deg, var(--blue-deep), var(--blue), var(--cyan));
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .04em;
}

.app-shell { min-height: 100vh; padding-top: 30px; }
.sidebar {
  position: fixed;
  inset: 30px auto 0 0;
  z-index: 20;
  width: 248px;
  display: flex;
  flex-direction: column;
  padding: 34px 18px 24px;
  background: rgba(255,255,255,.96);
  border-right: 1px solid var(--line);
}
.brand { padding: 0 14px 32px; }
.brand-kicker { display: block; margin-bottom: 6px; color: var(--blue); font-size: 10px; font-weight: 800; letter-spacing: .12em; }
.brand strong { display: block; font-size: 27px; letter-spacing: .04em; }
.brand-version { display: block; margin-top: 7px; color: var(--muted); font-size: 12px; }
.side-nav { display: grid; gap: 8px; }
.side-nav button, .settings-link {
  width: 100%;
  min-height: 52px;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 15px;
  border: 1px solid transparent;
  border-radius: 16px;
  background: transparent;
  font-size: 16px;
  text-align: left;
  cursor: pointer;
}
.side-nav button:hover, .settings-link:hover { background: var(--page-soft); }
.side-nav button.is-active, .settings-link.is-active {
  color: var(--blue-deep);
  background: linear-gradient(100deg, rgba(50,103,232,.10), rgba(44,191,208,.07));
  border-color: rgba(50,103,232,.05);
  font-weight: 800;
}
.nav-dot { width: 9px; height: 9px; flex: 0 0 auto; border: 1.5px solid #91a0b8; border-radius: 50%; background: #fff; }
.is-active > .nav-dot { border-color: var(--blue); background: var(--blue); box-shadow: 0 0 0 5px rgba(50,103,232,.09); }
.side-footer { margin-top: auto; padding-top: 20px; border-top: 1px solid var(--line); }
.side-footer p { margin: 15px 15px 0; color: var(--muted); font-size: 13px; }
.sync-dot { display: inline-block; width: 8px; height: 8px; margin-right: 9px; border-radius: 50%; background: var(--orange); }

.mobile-header, .bottom-nav { display: none; }
#appMain { min-height: calc(100vh - 30px); margin-left: 248px; padding: 36px clamp(28px, 4vw, 72px) 72px; }
.page-wrap { width: min(1320px, 100%); margin: 0 auto; }

.page-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 22px; margin-bottom: 28px; }
.eyebrow { margin: 0 0 7px; color: var(--blue); font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
h1, h2, h3, p { overflow-wrap: anywhere; }
.page-heading h1 { margin: 0; font-size: clamp(31px, 3vw, 44px); line-height: 1.14; letter-spacing: -.02em; }
.page-heading .subtitle { margin: 9px 0 0; color: var(--muted); font-size: 16px; line-height: 1.6; }
.preview-pill, .status-pill, .tag {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 30px;
  padding: 4px 11px;
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  background: rgba(255,255,255,.72);
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
}
.preview-pill { color: var(--blue-deep); border-color: rgba(50,103,232,.24); background: rgba(50,103,232,.07); }
.tag.qa { color: var(--blue-deep); border-color: #b7cdfc; background: #f0f5ff; }
.tag.review { color: #0d7e6b; border-color: #acdccc; background: #edf9f5; }
.tag.gpt { color: #6b4bc3; border-color: #d3c8f5; background: #f7f3ff; }
.tag.unread { color: #bb5a14; border-color: #f6c89f; background: #fff6ed; }
.tag.readable { color: #0d7e6b; border-color: #acdccc; background: #edf9f5; }
.tag.locked { color: #78869e; background: #f7f9fc; }

.card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-xl); box-shadow: var(--shadow-soft); }
.hero-card {
  position: relative;
  overflow: hidden;
  min-height: 220px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 30px;
  align-items: center;
  padding: clamp(28px, 4vw, 46px);
  background:
    radial-gradient(circle at 92% 14%, rgba(44,191,208,.19), transparent 30%),
    linear-gradient(125deg, #ffffff 0%, #f4f8ff 58%, #edfaff 100%);
}
.hero-card::after { content: ""; position: absolute; width: 240px; height: 240px; right: -96px; bottom: -130px; border: 30px solid rgba(50,103,232,.07); border-radius: 50%; }
.hero-copy { position: relative; z-index: 1; min-width: 0; }
.hero-label { margin: 0 0 14px; color: var(--blue); font-weight: 800; }
.hero-card h2 { max-width: 820px; margin: 0; font-size: clamp(23px, 2.3vw, 34px); line-height: 1.35; }
.hero-meta { margin: 13px 0 0; color: var(--muted); line-height: 1.6; }
.primary-button, .secondary-button, .ghost-button {
  min-height: 48px;
  padding: 0 20px;
  border-radius: 15px;
  border: 1px solid transparent;
  font-weight: 800;
  cursor: pointer;
  transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
}
.primary-button { color: #fff; background: linear-gradient(120deg, var(--blue), var(--cyan)); box-shadow: 0 12px 24px rgba(50,103,232,.20); }
.primary-button:hover { box-shadow: 0 15px 30px rgba(50,103,232,.25); }
.secondary-button { color: var(--blue-deep); border-color: #bfd2fb; background: #f6f9ff; }
.ghost-button { border-color: var(--line); background: #fff; }
.primary-button:disabled, .secondary-button:disabled, .ghost-button:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
.hero-action { position: relative; z-index: 1; min-width: 126px; }

.metric-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 18px; }
.metric-card { min-height: 122px; padding: 23px 25px; background: rgba(255,255,255,.92); border: 1px solid var(--line); border-radius: var(--radius-lg); }
.metric-card span { color: var(--muted); font-size: 13px; }
.metric-card strong { display: block; margin-top: 10px; font-size: 31px; letter-spacing: -.02em; }
.metric-card small { color: var(--blue); }

.section-block { margin-top: 34px; }
.section-heading { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 15px; }
.section-heading h2 { margin: 0; font-size: 22px; }
.section-heading p { margin: 0; color: var(--muted); font-size: 13px; }
.compact-list { display: grid; gap: 11px; }
.node-row {
  width: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 18px;
  align-items: center;
  padding: 18px 20px;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: #fff;
  color: var(--ink);
  text-align: left;
  cursor: pointer;
}
.node-row:hover { border-color: #afc7ef; box-shadow: var(--shadow-soft); }
.node-row:disabled { cursor: default; opacity: .72; box-shadow: none; }
.node-copy { min-width: 0; }
.node-copy strong { display: block; margin-bottom: 6px; font-size: 16px; line-height: 1.45; }
.node-copy span { display: -webkit-box; color: var(--muted); font-size: 13px; line-height: 1.55; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.node-tags { display: flex; justify-content: flex-end; gap: 7px; flex-wrap: wrap; }

.route-layout { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 20px; align-items: start; }
.phase-panel { position: sticky; top: 48px; padding: 12px; }
.phase-button { width: 100%; display: block; padding: 15px 14px; border: 1px solid transparent; border-radius: 14px; background: transparent; text-align: left; cursor: pointer; }
.phase-button strong { display: block; font-size: 14px; }
.phase-button span { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
.phase-button:hover { background: var(--page-soft); }
.phase-button.is-active { border-color: #bdd2f8; background: linear-gradient(100deg, rgba(50,103,232,.10), rgba(44,191,208,.07)); }
.week-card { overflow: hidden; }
.week-head { padding: 22px 24px; border-bottom: 1px solid var(--line); background: linear-gradient(110deg, #fff, #f5faff); }
.week-head span { color: var(--blue); font-size: 13px; font-weight: 800; }
.week-head h2 { margin: 7px 0 0; font-size: 22px; }
.week-head p { margin: 7px 0 0; color: var(--muted); font-size: 13px; }
.week-nodes { padding: 12px; }
.week-nodes .node-row { border-radius: 13px; border-color: transparent; border-bottom-color: var(--line); box-shadow: none; }
.week-nodes .node-row:last-child { border-bottom-color: transparent; }
.week-nodes .node-row:hover { background: #f8fbff; border-color: #c7d9f4; }

.search-bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; }
.search-input-wrap { position: relative; }
.search-input-wrap input { width: 100%; min-height: 58px; padding: 0 19px; border: 1px solid var(--line-strong); border-radius: 17px; background: #fff; color: var(--ink); font-size: 16px; }
.search-input-wrap input::placeholder { color: #9aa8be; }
.filter-row { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 14px; }
.filter-chip { min-height: 38px; padding: 0 15px; border: 1px solid var(--line); border-radius: 999px; background: #fff; cursor: pointer; }
.filter-chip.is-active { color: var(--blue-deep); border-color: var(--blue); background: #edf4ff; font-weight: 800; }
.search-summary { margin: 29px 0 13px; color: var(--muted); }
.empty-state { padding: 54px 24px; text-align: center; }
.empty-state h2 { margin: 0 0 8px; }
.empty-state p { margin: 0; color: var(--muted); }

.reader-heading { align-items: center; }
.reader-title { min-width: 0; }
.reader-title h1 { font-size: clamp(24px, 2.4vw, 36px); }
.reader-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.reader-shell { overflow: hidden; }
.reader-stage {
  position: relative;
  min-height: min(66vh, 780px);
  display: grid;
  place-items: center;
  overflow: hidden;
  padding: 24px;
  background: #eef3fa;
  touch-action: pan-y;
}
.reader-media-layer { position: absolute; inset: 24px; display: grid; place-items: center; opacity: 0; transition: opacity 150ms ease; pointer-events: none; }
.reader-media-layer.is-active { opacity: 1; }
.reader-media-layer img { display: block; max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; box-shadow: 0 12px 34px rgba(8,29,68,.14); }
.reader-placeholder { width: min(540px, 90%); padding: 42px; text-align: center; }
.reader-placeholder h2 { margin: 0 0 10px; }
.reader-placeholder p { color: var(--muted); line-height: 1.65; }
.reader-controls { display: grid; grid-template-columns: minmax(120px, 1fr) auto minmax(120px, 1fr); align-items: center; gap: 12px; padding: 14px; background: #fff; border-top: 1px solid var(--line); }
.reader-controls .next-wrap { text-align: right; }
.page-count { text-align: center; font-weight: 800; }
.reader-message { position: absolute; z-index: 4; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 10px 14px; border-radius: 12px; background: rgba(8,29,68,.86); color: #fff; font-size: 13px; }
.reader-message.is-hidden { display: none; }
.reader-select { width: min(650px, 100%); min-height: 48px; padding: 0 14px; border: 1px solid var(--line); border-radius: 13px; background: #fff; }

.progress-grid { display: grid; grid-template-columns: 1.2fr .8fr; gap: 18px; }
.progress-card { padding: 28px; }
.progress-card h2 { margin: 0 0 19px; font-size: 20px; }
.progress-number { display: flex; align-items: baseline; gap: 8px; margin-bottom: 13px; }
.progress-number strong { font-size: 42px; }
.progress-number span { color: var(--muted); }
.progress-track { height: 10px; overflow: hidden; border-radius: 999px; background: #e4e9f2; }
.progress-track > span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--blue), var(--cyan)); }
.progress-note { margin: 12px 0 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
.status-breakdown { display: grid; gap: 13px; }
.status-line { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; }
.status-line span { color: var(--muted); }
.status-line strong { font-size: 18px; }

.settings-grid { display: grid; gap: 16px; }
.settings-card { padding: 26px 28px; }
.settings-card h2 { margin: 0 0 8px; font-size: 19px; }
.settings-card p { margin: 0; color: var(--muted); line-height: 1.7; }
.settings-card .button-row { margin-top: 18px; }
.contract-list { margin: 14px 0 0; padding-left: 20px; color: var(--muted); line-height: 1.9; }
.danger-button { min-height: 44px; padding: 0 16px; border: 1px solid #efb5b5; border-radius: 13px; color: #b33b3b; background: #fff7f7; font-weight: 800; cursor: pointer; }

.fullscreen-reader {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  color: #f5f8ff;
  background: #0c1118;
}
.fullscreen-reader.is-hidden { display: none; }
.fullscreen-reader:fullscreen, .fullscreen-reader:-webkit-full-screen { width: 100vw; height: 100vh; background: #0c1118; }
.fs-header, .fs-footer { position: relative; z-index: 6; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 11px 16px; background: rgba(12,17,24,.92); border-color: rgba(255,255,255,.10); }
.fs-header { border-bottom: 1px solid rgba(255,255,255,.10); }
.fs-footer { border-top: 1px solid rgba(255,255,255,.10); }
.fs-title-wrap { min-width: 0; }
.fs-title-wrap strong { display: block; max-width: 62vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fs-title-wrap span, .fs-footer-tip { color: #aeb8c8; font-size: 12px; }
.fs-header-actions { display: flex; gap: 8px; }
.fs-header button, .zoom-control button { min-height: 38px; padding: 0 14px; border: 1px solid rgba(255,255,255,.20); border-radius: 12px; color: #fff; background: rgba(255,255,255,.08); cursor: pointer; }
.fs-header button:disabled { opacity: .35; }
.fs-header .fs-close { border-color: rgba(255,255,255,.36); }
.fs-stage { position: relative; min-height: 0; overflow: hidden; touch-action: none; user-select: none; cursor: grab; }
.fs-stage.is-dragging { cursor: grabbing; }
.fs-media-layer { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; transition: opacity 150ms ease; pointer-events: none; }
.fs-media-layer.is-active { opacity: 1; }
.fs-media-layer img { position: absolute; left: 50%; top: 50%; display: block; max-width: none; max-height: none; transform-origin: center; will-change: width, height, transform; box-shadow: 0 18px 52px rgba(0,0,0,.34); }
.fs-loader { position: absolute; z-index: 8; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 10px 14px; border-radius: 12px; background: rgba(0,0,0,.72); color: #fff; font-size: 13px; }
.fs-loader.is-hidden { display: none; }
.fs-edge { position: absolute; z-index: 7; top: 50%; width: 50px; height: 74px; transform: translateY(-50%); border: 1px solid rgba(255,255,255,.10); border-radius: 18px; color: rgba(255,255,255,.74); background: rgba(0,0,0,.20); font-size: 34px; cursor: pointer; }
.fs-edge:hover { background: rgba(255,255,255,.10); }
.fs-edge:disabled { opacity: .15; }
.fs-edge-left { left: 14px; }
.fs-edge-right { right: 14px; }
.zoom-control { display: grid; grid-template-columns: 46px 82px 46px; gap: 0; }
.zoom-control button { border-radius: 0; }
.zoom-control button:first-child { border-radius: 12px 0 0 12px; }
.zoom-control button:last-child { border-radius: 0 12px 12px 0; }
.zoom-control .zoom-readout { border-left: 0; border-right: 0; border-radius: 0; }

@media (max-width: 1050px) {
  .sidebar { width: 218px; }
  #appMain { margin-left: 218px; padding-left: 24px; padding-right: 24px; }
  .route-layout { grid-template-columns: 260px minmax(0, 1fr); }
  .node-tags .tag:nth-child(n+3) { display: none; }
}

@media (max-width: 760px) {
  .preview-ribbon { height: 26px; font-size: 10px; }
  .app-shell { padding-top: 26px; }
  .sidebar { display: none; }
  .mobile-header {
    position: sticky;
    top: 26px;
    z-index: 25;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    background: rgba(255,255,255,.94);
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(12px);
  }
  .mobile-header div span { display: block; color: var(--blue); font-size: 8px; font-weight: 800; letter-spacing: .1em; }
  .mobile-header div strong { display: block; margin-top: 2px; font-size: 19px; }
  .mobile-preview { color: var(--muted); font-size: 11px; }
  #appMain { min-height: auto; margin-left: 0; padding: 22px 15px calc(92px + env(safe-area-inset-bottom)); }
  .bottom-nav {
    position: fixed;
    inset: auto 0 0 0;
    z-index: 30;
    min-height: 66px;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
    background: rgba(255,255,255,.96);
    border-top: 1px solid var(--line);
    box-shadow: 0 -10px 30px rgba(36,72,132,.08);
    backdrop-filter: blur(12px);
  }
  .bottom-nav button { min-width: 0; display: grid; place-items: center; gap: 3px; padding: 5px 2px; border: 0; border-radius: 11px; color: var(--muted); background: transparent; font-size: 10px; cursor: pointer; }
  .bottom-nav button.is-active { color: var(--blue-deep); background: #eff5ff; font-weight: 800; }
  .mobile-nav-mark { width: 17px; height: 4px; border-radius: 999px; background: #c8d3e3; }
  .bottom-nav button.is-active .mobile-nav-mark { background: linear-gradient(90deg, var(--blue), var(--cyan)); }
  .page-heading { margin-bottom: 19px; }
  .page-heading h1 { font-size: 29px; }
  .page-heading .subtitle { font-size: 14px; }
  .page-heading > .preview-pill { display: none; }
  .hero-card { min-height: 0; grid-template-columns: 1fr; gap: 22px; padding: 24px 21px; border-radius: 20px; }
  .hero-card h2 { font-size: 22px; }
  .hero-action { width: 100%; }
  .hero-action .primary-button { width: 100%; }
  .metric-grid { grid-template-columns: 1fr; gap: 10px; }
  .metric-card { min-height: 88px; display: grid; grid-template-columns: 1fr auto; align-items: center; padding: 18px; }
  .metric-card strong { margin: 0; font-size: 27px; }
  .metric-card small { grid-column: 1 / -1; margin-top: 3px; }
  .section-block { margin-top: 27px; }
  .node-row { grid-template-columns: 1fr; gap: 11px; padding: 17px 16px; }
  .node-tags { justify-content: flex-start; }
  .route-layout { grid-template-columns: 1fr; }
  .phase-panel { position: static; display: flex; gap: 8px; padding: 8px; overflow-x: auto; }

.route-round-toggle { min-height: 76px; grid-template-columns: minmax(0, 1fr) auto 36px; gap: 12px; padding: 11px 14px; border-radius: 22px; }

    const initialNode = readableNodes[0] || nodes[0] || null;
    const initialWeek = Number(initialNode?.week || weeks[0]?.week || 1);
    const initialRound = weekByNumber.get(initialWeek)?.round || initialNode?.round || "";
    const defaults = {
      view: "home",
      selectedNodeId: initialNode?.id || "",
      selectedWeek: initialWeek,
      routeOpenGroup: initialRound,
      routeOpenWeek: initialWeek,
      routeOpenChapter: initialNode ? routeChapterKey(initialNode, initialWeek) : "",
      routeOpenSection: initialNode ? routeSectionKey(initialNode, initialWeek) : "",
      searchFilter: "all",
      searchFilters: { book: "all", depth: "all", status: "readable" },
      searchQuery: "",
      pages: {},
      completed: [],
      recent: [],
      recentCompletionVersion: 1
    };
    try {
      const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      const parsedCompleted = Array.isArray(parsed.completed)
        ? parsed.completed
        : Object.keys(parsed.completed || {}).filter((id) => parsed.completed[id]);
      const parsedPages = parsed.pages && typeof parsed.pages === "object"
        ? parsed.pages
        : (parsed.pageIndexes && typeof parsed.pageIndexes === "object" ? parsed.pageIndexes : {});
      const completed = parsedCompleted.filter((id) => nodeById.has(id));
      const completedSet = new Set(completed);
      const recent = Number(parsed.recentCompletionVersion || 0) >= 1 && Array.isArray(parsed.recent)
        ? [...new Set(parsed.recent.filter((id) => nodeById.has(id) && completedSet.has(id)))].slice(0, 12)
        : [...completed].reverse().slice(0, 12);
      return {
        ...defaults,
        ...parsed,
        selectedNodeId: parsed.selectedNodeId || parsed.currentNodeId || defaults.selectedNodeId,
        searchFilters: parsed.searchFilters && typeof parsed.searchFilters === "object"
          ? { ...defaults.searchFilters, ...parsed.searchFilters }
          : defaults.searchFilters,
        pages: parsedPages,
        completed,
        recent,
        recentCompletionVersion: 1,
        revision: Number(parsed.revision || 0)
      };
    } catch {
      return defaults;
    }
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function setSyncStatus(text, mode = "") {
    for (const id of ["syncStatus", "mobileSyncStatus"]) {
      const element = document.getElementById(id);
      if (!element) continue;
      element.textContent = text;
      element.dataset.status = mode;
    }
    const dot = document.querySelector(".sync-dot");
    if (dot) dot.dataset.status = mode;
  }

  function applyCloudState(payload) {
    const routeFocus = captureRouteFocus();
    const cloud = payload && payload.state ? payload.state : {};
    const completed = Object.keys(cloud.completed || {}).filter((id) => nodeById.has(id) && cloud.completed[id]);
    const pages = {};
    for (const id of Object.keys(cloud.pageIndexes || {})) {
      if (nodeById.has(id)) pages[id] = Math.max(1, Number(cloud.pageIndexes[id] || 0) + 1);
    }
    const completedSet = new Set(completed);
    state = {
      ...state,
      selectedNodeId: nodeById.has(cloud.currentNodeId) ? cloud.currentNodeId : state.selectedNodeId,
      completed,
      recent: state.recent.filter((id) => completedSet.has(id)),
      pages,
      revision: Number(cloud.revision || 0)
    };
    saveState();
    updateHash("replace");
    render();
    restoreRouteFocus(routeFocus);
  }

  function jsonp(params) {
    return new Promise((resolve, reject) => {
      const callbackName = `__chemProgress${Date.now()}${Math.random().toString(16).slice(2)}`;
      const script = document.createElement("script");
      const query = new URLSearchParams(params);
      query.set("callback", callbackName);
      query.set("_", Date.now().toString());
      const timer = window.setTimeout(() => {
        cleanup();
        reject(new Error("timeout"));
      }, 15000);
      function cleanup() {
        window.clearTimeout(timer);
        window[callbackName] = () => {};
        window.setTimeout(() => { delete window[callbackName]; }, 60000);
        script.remove();
      }
      window[callbackName] = (payload) => {
        cleanup();
        resolve(payload);
      };
      script.onerror = () => {
        cleanup();
        reject(new Error("network error"));
      };
      script.src = PROGRESS_API_URL + (PROGRESS_API_URL.includes("?") ? "&" : "?") + query.toString();
      document.head.appendChild(script);
    });
  }

  async function bootstrapCloudProgress() {
    if (!IS_FORMAL || !PROGRESS_API_URL) return;
    setSyncStatus("同步中", "pending");
    try {
      const payload = await jsonp({ action: "bootstrap" });
      if (!payload || !payload.ok) throw new Error(payload?.error || "bootstrap failed");
      applyCloudState(payload);
      setSyncStatus("雲端進度已同步", "online");
    } catch {
      setSyncStatus("離線閱讀中", "error");
    }
  }

  function queueMutation(action, fields = {}) {
    saveState();
    if (!IS_FORMAL || !PROGRESS_API_URL) return;
    const mutationId = window.crypto?.randomUUID?.() || `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;
    syncQueue = syncQueue.then(async () => {
      setSyncStatus("儲存中", "pending");
      const payload = await jsonp({
        action,
        mutationId,
        expectedRevision: String(state.revision || 0),
        ...fields
      });
      if (!payload || !payload.ok) throw new Error(payload?.error || "mutation failed");
      state.revision = Number(payload.revision || state.revision);
      saveState();
      setSyncStatus("雲端進度已同步", "online");
    }).catch(() => {
      setSyncStatus("離線閱讀中", "error");
    });
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function isReadable(node) {
    return Boolean(node && node.officialComplete === true && Array.isArray(node.images) && node.images.length > 0);
  }

  function hasQa(node) {
    return Boolean(node && (node.mainProgressPass === true || node.productionStatus === "QA PASS" || node.productionStatus === "GPT PASS"));
  }

  function currentPage(node) {
    const value = Number(state.pages[node?.id] || 1);
    return Math.min(Math.max(value, 1), Math.max(node?.images?.length || 1, 1));
  }

  function titleParts(node) {
    const parts = String(node?.title || "未命名節點").split("｜");
    return {
      route: parts[0] || "",
      subject: parts[1] || "",
      leaf: parts.slice(2).join("｜") || parts.at(-1) || "未命名節點"
    };
  }

  function nodeHierarchy(node) {
    const title = titleParts(node);
    const goalParts = String(node?.goal || "").split("｜").filter(Boolean);
    const chapterNumber = Number(node?.chapter);
    const subjectName = node?.book === "clayden" ? "有機化學" : (node?.book === "central" ? "基礎化學" : "");
    const chapterLabel = Number.isInteger(chapterNumber) && chapterNumber > 0
      ? `${subjectName ? subjectName + " · " : ""}第${chapterNumber}章`
      : (title.subject || "其他節點");
    const chapterTitle = goalParts[0] && goalParts[0] !== title.leaf ? goalParts[0] : "";
    const sectionCode = String(node?.section || "");
    const leafNumber = /^\S+/u.exec(title.leaf)?.[0] || "";
    const sectionNumber = sectionCode
      ? (node?.book === "central" ? sectionCode.replaceAll("-", ".") : (leafNumber || sectionCode))
      : "";
    const sectionTitle = node?.topic != null && goalParts.length > 1
      ? goalParts.at(-2)
      : (goalParts.at(-1) || title.leaf);
    const sectionLabel = [sectionNumber, sectionTitle].filter(Boolean).join(" ");
    return { chapterLabel, chapterTitle, sectionNumber, sectionTitle, sectionLabel };
  }

  function iconMarkup(name) {
    const icons = {
      back: '<path d="m15 18-6-6 6-6"/><path d="M9 12h10"/>',
      book: '<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v17H6.5A2.5 2.5 0 0 0 4 22.5z"/><path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H13v17h4.5a2.5 2.5 0 0 1 2.5 2.5z"/>',
      catalog: '<path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/><path d="M4 6h.01M4 12h.01M4 18h.01"/>',
      volume: '<path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18 6a8.5 8.5 0 0 1 0 12"/>',
      fullscreen: '<path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/>',
      info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/>',
      check: '<circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.2 2.2 4.8-5"/>',
      search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
      pin: '<path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>',
      chevron: '<path d="m9 18 6-6-6-6"/>',
      close: '<path d="m6 6 12 12M18 6 6 18"/>'
    };
    return '<svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + (icons[name] || "") + "</svg>";
  }

  function nodePath(node) {
    const title = titleParts(node);
    return [title.subject, ...String(node?.goal || "").split("｜").filter(Boolean).slice(-2)].filter(Boolean).join("  ›  ");
  }

  function roundLabel(value) {
    return String(value || "學習階段").replaceAll("｜", " · ");
  }

  function nodeUserStatus(node) {
    if (node?.id === state.selectedNodeId) return { key: "current", label: "目前" };
    if (state.completed.includes(node?.id)) return { key: "completed", label: "已讀" };
    if (isReadable(node)) return { key: "readable", label: "可讀" };
    return { key: "locked", label: "未解鎖" };
  }

  function markRecentlyCompleted(nodeId) {
    if (!state.completed.includes(nodeId)) return;
    state.recent = [nodeId, ...state.recent.filter((id) => id !== nodeId)].slice(0, 12);
  }

  function removeRecentlyCompleted(nodeId) {
    state.recent = state.recent.filter((id) => id !== nodeId);
  }

  function getRecentCompletedNodes(limit = 12) {
    const completedSet = new Set(state.completed);
    return state.recent
      .filter((id) => completedSet.has(id))
      .map((id) => nodeById.get(id))
      .filter(Boolean)
      .slice(0, limit);
  }

  function getRecentCompletedNode() {
    return getRecentCompletedNodes(1)[0] || null;
  }

  function tagMarkup(node, compact = false) {
    const tags = [];
    if (hasQa(node)) tags.push('<span class="tag qa">QA PASS</span>');
    if (node?.contentReviewPass === true) tags.push('<span class="tag review">內容二審</span>');
    tags.push(isReadable(node)
      ? `<span class="tag readable">可閱讀${compact ? "" : ` · ${node.images.length} 頁`}</span>`
      : '<span class="tag locked">尚未解鎖</span>');
    return tags.join("");
  }

  function nodeRow(node) {
    const title = titleParts(node);
    return `
      <button type="button" class="node-row" data-open-node="${escapeHtml(node.id)}" ${isReadable(node) ? "" : "disabled"}>
        <span class="node-copy">
          <strong>${escapeHtml(title.leaf)}</strong>
          <span>${escapeHtml(node.goal || `${title.route} · ${title.subject}`)}</span>
        </span>
        <span class="node-tags">${tagMarkup(node, true)}</span>
      </button>`;
  }

  function routeNodeRow(node) {
    const title = titleParts(node);
    const status = state.completed.includes(node?.id)
      ? { key: "completed", label: "已讀" }
      : (isReadable(node) ? { key: "readable", label: "可讀" } : { key: "locked", label: "未解鎖" });
    return `
      <button type="button" class="route-node-row status-${status.key}" data-open-node="${escapeHtml(node.id)}" data-node-behavior="read-or-info" aria-label="${escapeHtml(`${title.leaf}，${status.label}，${node.depth || "未設定深度"}`)}">
        <span class="status-dot" aria-hidden="true"></span>
        <span class="route-node-copy">
          <strong>${escapeHtml(title.leaf)}</strong>
          <small>${escapeHtml(node.depth || "未設定深度")}</small>
        </span>
        <span class="route-node-state">${escapeHtml(status.label)}</span>
        ${iconMarkup("chevron")}
      </button>`;
  }

  function pageHeading(kicker, title, subtitle) {
    return `
      <header class="page-heading">
        <div>
          <h1>${escapeHtml(title)}</h1>
          <p class="subtitle">${escapeHtml(subtitle)}</p>
        </div>
      </header>`;
  }

  function setActiveNavigation() {
    document.querySelectorAll("[data-view]").forEach((button) => {
      button.classList.toggle("is-active", button.dataset.view === state.view);
    });
  }

  function updateHash(mode = "replace") {
    const params = new URLSearchParams();
    params.set("view", state.view);
    if (state.selectedNodeId) params.set("node", state.selectedNodeId);
    const node = nodeById.get(state.selectedNodeId);
    if (node) params.set("page", String(currentPage(node)));
    const value = `#${params.toString()}`;
    if (mode === "push") history.pushState(null, "", value);
    else history.replaceState(null, "", value);
  }

  function applyHash() {
    const params = new URLSearchParams(location.hash.replace(/^#/, ""));
    const view = params.get("view");
    const nodeId = params.get("node");
    const page = Number(params.get("page"));
    if (["home", "route", "search", "reader", "progress", "settings"].includes(view)) state.view = view;
    if (nodeById.has(nodeId)) state.selectedNodeId = nodeId;
    if (nodeById.has(nodeId) && Number.isInteger(page) && page > 0) state.pages[nodeId] = page;
  }

  function resetViewScroll() {
    window.scrollTo({ top: 0, left: 0, behavior: "auto" });
  }

  function navigate(view, push = true) {
    state.view = view;
    saveState();
    updateHash(push ? "push" : "replace");
    render();
    appMain.focus({ preventScroll: true });
    resetViewScroll();
  }

  function openNode(nodeId) {
    const node = nodeById.get(nodeId);
    if (!isReadable(node)) return;
    const nodeWeek = Number(node.week || state.selectedWeek);
    state.selectedNodeId = node.id;
    state.selectedWeek = nodeWeek;
    state.routeOpenGroup = weekByNumber.get(nodeWeek)?.round || node.round || "";
    state.routeOpenWeek = nodeWeek;
    state.routeOpenChapter = routeChapterKey(node, nodeWeek);
    state.routeOpenSection = routeSectionKey(node, nodeWeek);
    state.view = "reader";
    saveState();
    updateHash("push");
    render();
    queueMutation("setCurrent", { nodeId: node.id });
    resetViewScroll();
  }

  function getResumeNode() {
    const selected = nodeById.get(state.selectedNodeId);
    if (isReadable(selected)) return selected;
    return readableNodes[0] || nodes[0] || null;
  }

  function renderHome() {
    const resume = getResumeNode();
    const completedSet = new Set(state.completed);
    const qaCount = nodes.filter(hasQa).length;
    const reviewCount = nodes.filter((node) => node.contentReviewPass === true).length;
    const completedCount = state.completed.length;
    const selectedWeek = weekByNumber.get(Number(resume?.week || state.selectedWeek)) || weeks[0];
    const nextNodes = (selectedWeek?.nodeIds || []).map((id) => nodeById.get(id)).filter(Boolean).slice(0, 4);
    const resumeTitle = titleParts(resume);
    const page = currentPage(resume);

    appMain.innerHTML = `<div class="page-wrap">
      ${pageHeading("Today", "首頁", "從上次停留的位置繼續，不必重新尋找章節。")}
      <section class="card hero-card">
        <div class="hero-copy">
          <p class="hero-label">繼續閱讀 · ${escapeHtml(resume?.depth || "學習節點")}</p>
          <h2>${escapeHtml(resumeTitle.leaf)}</h2>
          <p class="hero-meta">${escapeHtml(resume?.goal || "尚無節點說明")}<br>目前第 ${page} / ${resume?.images?.length || 0} 頁</p>
        </div>
        <div class="hero-action">
          <button type="button" class="primary-button" data-open-node="${escapeHtml(resume?.id || "")}" ${isReadable(resume) ? "" : "disabled"}>繼續閱讀</button>
        </div>
      </section>
      <section class="metric-grid" aria-label="學習摘要">
        <div class="metric-card"><span>個人完成</span><strong>${completedCount} / ${readableNodes.length}</strong><small>${IS_FORMAL ? "已同步正式雲端進度" : "只記錄在本機預覽"}</small></div>
        <div class="metric-card"><span>正式內容進度</span><strong>${qaCount}</strong><small>QA PASS 路線節點</small></div>
        <div class="metric-card"><span>內容二審</span><strong>${reviewCount}</strong><small>與個人完成分開顯示</small></div>
      </section>
      <section class="section-block">
        <div class="section-heading"><div><h2>接著閱讀</h2><p>${escapeHtml(selectedWeek?.round || "學習路線")} · 第 ${escapeHtml(selectedWeek?.week || "-")} 週</p></div></div>
        <div class="compact-list">${nextNodes.length ? nextNodes.map(nodeRow).join("") : '<div class="card empty-state"><h2>目前沒有節點</h2><p>請到學習路線選擇其他週次。</p></div>'}</div>
      </section>
    </div>`;
  }

  function routeGroups() {
    const groups = [];
    const map = new Map();
    for (const week of weeks) {
      const key = week.round || "其他階段";
      if (!map.has(key)) {
        const item = { key, weeks: [] };
        map.set(key, item);
        groups.push(item);
      }
      map.get(key).weeks.push(week);
    }
    return groups;
  }

  function routeChapterKey(node, weekNumber) {
    const chapterLabel = titleParts(node).subject || node?.chapter || "未分類章節";
    return `${Number(weekNumber || node?.week || 0)}::${chapterLabel}`;
  }

  function routeSectionKey(node, weekNumber) {
    const section = String(node?.section || node?.id || "未分類節點");
    return `${routeChapterKey(node, weekNumber)}::${section}`;
  }

  function routeChapterGroups(week) {
    const groups = [];
    const map = new Map();
    for (const nodeId of week?.nodeIds || []) {
      const node = nodeById.get(nodeId);
      if (!node) continue;
      const hierarchy = nodeHierarchy(node);
      const label = hierarchy.chapterLabel;
      const key = routeChapterKey(node, week.week);
      if (!map.has(key)) {
        const item = { key, label, title: hierarchy.chapterTitle, nodes: [] };
        map.set(key, item);
        groups.push(item);
      }
      map.get(key).nodes.push(node);
    }
    return groups;
  }

  function routeChapterItems(chapter, weekNumber) {
    const items = [];
    const map = new Map();
    for (const node of chapter?.nodes || []) {
      if (node?.topic == null) {
        items.push({ type: "node", key: `node::${node.id}`, node });
        continue;
      }
      const hierarchy = nodeHierarchy(node);
      const key = routeSectionKey(node, weekNumber);
      if (!map.has(key)) {
        const item = { type: "section", key, label: hierarchy.sectionLabel || "其他節點", nodes: [] };
        map.set(key, item);
        items.push(item);
      }
      map.get(key).nodes.push(node);
    }
    return items;
  }

  function routeSectionGroups(chapter, weekNumber) {
    return routeChapterItems(chapter, weekNumber).filter((item) => item.type === "section");
  }

  function nextRouteNode(node) {
    const index = nodes.findIndex((item) => item.id === node?.id);
    return index >= 0 ? (nodes[index + 1] || null) : null;
  }

  function previousRouteNode(node) {
    const index = nodes.findIndex((item) => item.id === node?.id);
    return index > 0 ? (nodes[index - 1] || null) : null;
  }

  function readerScopeNodes(node) {
    if (!node) return [];
    return nodes.filter((candidate) =>
      isReadable(candidate)
      && candidate.round === node.round
      && Number(candidate.week) === Number(node.week)
      && candidate.book === node.book
      && Number(candidate.chapter) === Number(node.chapter)
      && String(candidate.section || "") === String(node.section || "")
    );
  }

  function readerScopeLabel(node) {
    const [month, round] = String(node?.round || "").split("｜");
    const hierarchy = nodeHierarchy(node);
    return [month, round, `第 ${Number(node?.week || 0)} 週`, hierarchy.chapterLabel, hierarchy.sectionLabel].filter(Boolean).join(" · ");
  }

  function restoreRouteToggleFocus(attribute, value) {
    const target = Array.from(document.querySelectorAll(`[data-${attribute}]`))
      .find((element) => String(element.dataset[attribute]) === String(value));
    target?.focus({ preventScroll: true });
  }

  function captureRouteFocus() {
    if (state.view !== "route") return null;
    const active = document.activeElement;
    if (!(active instanceof HTMLElement) || !active.closest(".route-page")) return null;
    if (active.id === "routeCollapseAll") return { type: "collapse" };
    for (const type of ["phase", "week", "chapter", "section"]) {
      if (active.dataset[type] != null) return { type, value: active.dataset[type] };
    }
    if (active.dataset.openNode) return { type: "node", value: active.dataset.openNode };
    return null;
  }

  function restoreRouteFocus(snapshot) {
    if (!snapshot || state.view !== "route") return;
    if (snapshot.type === "collapse") {
      document.getElementById("routeCollapseAll")?.focus({ preventScroll: true });
      return;
    }
    if (snapshot.type === "node") {
      document.querySelector(`[data-open-node="${CSS.escape(snapshot.value)}"]`)?.focus({ preventScroll: true });
      return;
    }
    restoreRouteToggleFocus(snapshot.type, snapshot.value);
  }

  function bindRouteToggle(button, activate) {
    button.addEventListener("click", activate);
    button.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" && event.key !== " ") return;
      event.preventDefault();
      activate();
    });
  }

  function setRouteToggleState(button, open) {
    button.parentElement?.classList.toggle("is-open", open);
    button.setAttribute("aria-expanded", String(open));
  }

  function syncRouteMenuState() {
    document.querySelectorAll("[data-phase]").forEach((button) => {
      setRouteToggleState(button, state.routeOpenGroup === button.dataset.phase);
    });
    document.querySelectorAll("[data-week]").forEach((button) => {
      setRouteToggleState(button, Number(state.routeOpenWeek) === Number(button.dataset.week));
    });
    document.querySelectorAll("[data-chapter]").forEach((button) => {
      setRouteToggleState(button, state.routeOpenChapter === button.dataset.chapter);
    });
    document.querySelectorAll("[data-section]").forEach((button) => {
      setRouteToggleState(button, state.routeOpenSection === button.dataset.section);
    });
  }

  function announceRouteStatus(message) {
    const status = document.getElementById("routeMenuStatus");
    if (status) status.textContent = message;
  }

  function revealRecentCompletedNode(node) {
    if (!node) return;
    const weekNumber = Number(node.week || state.selectedWeek);
    state.selectedWeek = weekNumber;
    state.routeOpenGroup = weekByNumber.get(weekNumber)?.round || node.round || "";
    state.routeOpenWeek = weekNumber;
    state.routeOpenChapter = routeChapterKey(node, weekNumber);
    state.routeOpenSection = node?.topic == null ? "" : routeSectionKey(node, weekNumber);
    saveState();
    syncRouteMenuState();
    announceRouteStatus(`已展開並移到最近閱讀節點：${titleParts(node).leaf}。`);
    const reducedMotion = window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches;
    window.setTimeout(() => {
      const target = document.querySelector(`.route-node-row[data-open-node="${CSS.escape(node.id)}"]`);
      if (!target) return;
      target.focus({ preventScroll: true });

                        ${chapterGroups.length ? chapterGroups.map((chapter, chapterIndex) => {

                          const chapterItems = routeChapterItems(chapter, week.week);

                                <span>${chapter.nodes.length} 節點</span>

                              <div class="route-submenu" id="${chapterPanelId}"><div class="route-submenu-inner"><div class="route-section-list">
                                ${chapterItems.map((item, itemIndex) => {
                                  if (item.type === "node") return `<div class="route-direct-node">${routeNodeRow(item.node)}</div>`;
                                  const sectionOpen = state.routeOpenSection === item.key;
                                  const sectionPanelId = `route-section-panel-${groupIndex + 1}-${weekIndex + 1}-${chapterIndex + 1}-${itemIndex + 1}`;
                                  return `<section class="route-section ${sectionOpen ? "is-open" : ""}">

                                    <div class="route-submenu" id="${sectionPanelId}"><div class="route-submenu-inner"><div class="route-node-list">${item.nodes.map(routeNodeRow).join("")}</div></div></div>

                      </div></div></div>
                    </section>`;

            </section>`;

      </nav>
    </div>`;

    document.getElementById("recentLocationButton")?.addEventListener("click", () => revealRecentCompletedNode(currentNode));

    document.querySelectorAll("[data-phase]").forEach((button) => bindRouteToggle(button, () => {
      const group = groups.find((item) => item.key === button.dataset.phase);
      if (!group?.weeks[0]) return;
      if (state.routeOpenGroup === group.key) {
        state.routeOpenGroup = "";
        state.routeOpenWeek = 0;
        state.routeOpenChapter = "";
        state.routeOpenSection = "";
      } else {
        const activeWeek = group.weeks.find((week) => Number(week.week) === Number(state.selectedWeek)) || group.weeks[0];
        state.selectedWeek = Number(activeWeek.week);
        state.routeOpenGroup = group.key;
        state.routeOpenWeek = 0;
        state.routeOpenChapter = "";
        state.routeOpenSection = "";

      saveState();
      syncRouteMenuState();
      restoreRouteToggleFocus("phase", group.key);
      announceRouteStatus(state.routeOpenGroup === group.key ? `已展開 ${roundLabel(group.key)}。` : `已閉合 ${roundLabel(group.key)}。`);

    document.querySelectorAll("[data-week]").forEach((button) => bindRouteToggle(button, () => {

      const week = weekByNumber.get(weekNumber);

        state.routeOpenWeek = 0;
        state.routeOpenChapter = "";
        state.routeOpenSection = "";
      } else {
        state.selectedWeek = weekNumber;
        state.routeOpenGroup = week?.round || state.routeOpenGroup;
        state.routeOpenWeek = weekNumber;
        state.routeOpenChapter = "";
        state.routeOpenSection = "";

      syncRouteMenuState();
      restoreRouteToggleFocus("week", weekNumber);

    document.querySelectorAll("[data-chapter]").forEach((button) => bindRouteToggle(button, () => {

      const weekNumber = Number(button.dataset.chapterWeek);
      const chapter = routeChapterGroups(weekByNumber.get(weekNumber)).find((item) => item.key === chapterKey);
      if (state.routeOpenChapter === chapterKey) {
        state.routeOpenChapter = "";
        state.routeOpenSection = "";
      } else {
        state.routeOpenChapter = chapterKey;
        state.routeOpenSection = "";
      }
      state.routeOpenWeek = weekNumber;

      syncRouteMenuState();
      restoreRouteToggleFocus("chapter", chapterKey);

    }));
    document.querySelectorAll("[data-section]").forEach((button) => bindRouteToggle(button, () => {
      const sectionKey = button.dataset.section;
      state.routeOpenSection = state.routeOpenSection === sectionKey ? "" : sectionKey;
      state.routeOpenWeek = Number(button.dataset.sectionWeek);
      saveState();
      syncRouteMenuState();
      restoreRouteToggleFocus("section", sectionKey);
      announceRouteStatus(state.routeOpenSection === sectionKey ? "已展開節點清單。" : "已閉合節點清單。");
    }));
    document.getElementById("routeCollapseAll")?.addEventListener("click", () => {
      state.routeOpenGroup = "";
      state.routeOpenWeek = 0;
      state.routeOpenChapter = "";
      state.routeOpenSection = "";
      saveState();
      syncRouteMenuState();
      document.getElementById("routeCollapseAll")?.focus({ preventScroll: true });
      announceRouteStatus("已閉合全部學習路線選單。");
    });

  function matchesSearchFilters(node, filters) {
    if (filters.book !== "all" && node?.book !== filters.book) return false;
    if (filters.depth !== "all" && node?.depth !== filters.depth) return false;
    if (filters.status === "readable" && !isReadable(node)) return false;
    if (filters.status === "unread" && (!isReadable(node) || state.completed.includes(node.id))) return false;
    if (filters.status === "completed" && !state.completed.includes(node.id)) return false;
    if (filters.status === "locked" && isReadable(node)) return false;
    return true;
  }

  function searchNodes(query, filters) {
    const needle = query.trim().toLocaleLowerCase("zh-Hant");
    return nodes.filter((node) => {
      if (!matchesSearchFilters(node, filters)) return false;
      if (!needle) return true;
      const haystack = [node.id, node.title, node.goal, node.focus, node.depth, node.book, node.chapter, node.section].join(" ").toLocaleLowerCase("zh-Hant");
      return haystack.includes(needle);
    });
  }

  function searchResultRow(node) {
    const title = titleParts(node);
    const status = nodeUserStatus(node);
    return `
      <button type="button" class="search-result-row status-${status.key}" data-open-node="${escapeHtml(node.id)}" ${isReadable(node) ? "" : "disabled"}>
        <span class="result-icon">${iconMarkup("book")}</span>
        <span class="result-copy">
          <strong>${escapeHtml(title.leaf)}</strong>
          <span>${escapeHtml(nodePath(node))}</span>
        </span>
        <span class="result-meta"><small>深度</small><strong>${escapeHtml(node.depth || "未設定")}</strong></span>
        <span class="result-meta result-status"><small>狀態</small><strong>${escapeHtml(status.label)}</strong></span>
        ${iconMarkup("chevron")}
      </button>`;
  }

  function renderSearchResults(query, filters) {
    const target = document.getElementById("searchResults");
    const summary = document.getElementById("searchSummary");
    if (!target || !summary) return;
    const matches = searchNodes(query, filters);
    summary.textContent = `搜尋結果 · ${matches.length} 個節點${matches.length > 40 ? "，先顯示前 40 筆" : ""}`;
    target.innerHTML = matches.length
      ? matches.slice(0, 40).map(searchResultRow).join("")
      : '<div class="card empty-state"><h2>沒有符合的節點</h2><p>可改用章號、主題關鍵字或調整狀態篩選。</p></div>';
  }

  function renderSearch() {
    const filterGroup = (label, key, values) => `
      <div class="search-filter-group">
        <strong>${escapeHtml(label)}</strong>
        <div>
          ${values.map(([value, text]) => `<button type="button" class="filter-chip ${state.searchFilters[key] === value ? "is-active" : ""}" data-filter-group="${key}" data-filter-value="${escapeHtml(value)}">${escapeHtml(text)}</button>`).join("")}
        </div>
      </div>`;
    appMain.innerHTML = `<div class="page-wrap search-page">
      ${pageHeading("Find A Topic", "搜尋", "")}
      <section class="search-bar">
        <label class="search-input-wrap">
          ${iconMarkup("search")}
          <input id="searchInput" type="search" autocomplete="off" value="${escapeHtml(state.searchQuery || "")}" placeholder="搜尋章節、概念或節點">
        </label>
        <button type="button" class="primary-button" id="searchButton">搜尋</button>
      </section>
      <section class="search-filter-panel" id="searchFilters">
        ${filterGroup("教材", "book", [["all","全部"],["central","基礎化學"],["clayden","有機化學"]])}
        ${filterGroup("深度", "depth", [["all","全部"],["掃過","掃過"],["基礎讀","基礎讀"],["精讀","精讀"]])}
        ${filterGroup("狀態", "status", [["readable","可讀"],["unread","未讀"],["completed","已讀"],["locked","未解鎖"]])}
      </section>
      <h2 class="search-results-title">搜尋結果</h2>
      <p class="search-summary" id="searchSummary"></p>
      <div class="search-results-card" id="searchResults"></div>
    </div>`;
    const input = document.getElementById("searchInput");
    const refresh = () => {
      state.searchQuery = input.value;
      saveState();
      renderSearchResults(input.value, state.searchFilters);
    };
    input.addEventListener("input", refresh);
    document.getElementById("searchButton").addEventListener("click", refresh);
    document.querySelectorAll("[data-filter-group]").forEach((button) => button.addEventListener("click", () => {
      state.searchFilters[button.dataset.filterGroup] = button.dataset.filterValue;
      saveState();
      document.querySelectorAll(`[data-filter-group="${button.dataset.filterGroup}"]`).forEach((item) => item.classList.toggle("is-active", item === button));
      refresh();
    }));
    refresh();
  }

  function audioSource(node) {
    return node?.audio?.directUrl || node?.audio?.url || "";
  }

  function nodeInfoDrawer(node) {
    const title = titleParts(node);
    const hierarchy = nodeHierarchy(node);
    const image = node?.images?.[currentPage(node) - 1];
    const rows = [
      ["教材", node?.book === "clayden" ? "有機化學" : "基礎化學"],
      ["章", [hierarchy.chapterLabel.replace(/^(基礎化學|有機化學) · /u, ""), hierarchy.chapterTitle].filter(Boolean).join("｜")],
      ...(node?.topic != null ? [["節", [hierarchy.sectionNumber, hierarchy.sectionTitle].filter(Boolean).join("｜")]] : []),
      ["學習安排", roundLabel(node?.round) + " · 第 " + (node?.week || "-") + " 週"],
      ["閱讀深度", node?.depth || "未設定"],
      ["正式 QA", hasQa(node) ? "已通過" : "尚未通過"],
      ["內容二審", node?.contentReviewPass === true ? "已通過" : "尚未通過"],
      ["正式圖片", isReadable(node) ? (node.images.length + " 張") : "尚未公開"],
      ["閱讀狀態", isReadable(node) ? "已解鎖" : "尚未解鎖（正式圖片尚未公開）"],
      ["語音", audioSource(node) ? "可播放" : "尚無語音"]
