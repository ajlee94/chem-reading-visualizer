            <div><small>節點資訊</small><h2 id="nodeInfoTitle">${escapeHtml(title.leaf)}</h2></div>
            <button type="button" class="drawer-close" id="nodeInfoClose" aria-label="關閉節點資訊">${iconMarkup("close")}</button>
          </header>
          <dl>${rows.map(([label,value]) => `<div><dt>${escapeHtml(label)}</dt><dd>${escapeHtml(value)}</dd></div>`).join("")}</dl>
          ${image?.previewUrl ? `<a class="drive-link" href="${escapeHtml(image.previewUrl)}" target="_blank" rel="noreferrer">在 Drive 開啟目前圖片</a>` : ""}
        </aside>
      </div>`;
  }

  let nodeInfoReturnFocus = null;

  function closeNodeInfo() {
    const backdrop = document.getElementById("nodeInfoBackdrop");
    if (!backdrop) return;
    backdrop.remove();
    const returnFocus = nodeInfoReturnFocus;
    nodeInfoReturnFocus = null;
    returnFocus?.focus?.({ preventScroll: true });
  }

  function openNodeInfo(node, returnFocus) {
    if (!node) return;
    document.getElementById("nodeInfoBackdrop")?.remove();
    nodeInfoReturnFocus = returnFocus instanceof HTMLElement ? returnFocus : document.activeElement;
    document.body.insertAdjacentHTML("beforeend", nodeInfoDrawer(node));
    const backdrop = document.getElementById("nodeInfoBackdrop");
    const closeButton = document.getElementById("nodeInfoClose");
    backdrop?.classList.remove("is-hidden");
    closeButton?.addEventListener("click", closeNodeInfo);
    backdrop?.addEventListener("click", (event) => { if (event.target === backdrop) closeNodeInfo(); });
    closeButton?.focus({ preventScroll: true });
  }

  function renderReader() {
    const node = getResumeNode();
    if (node) state.selectedNodeId = node.id;
    const title = titleParts(node);
    const page = currentPage(node);
    const completed = state.completed.includes(node?.id);
    const total = node?.images?.length || 0;
    const progress = total ? Math.round(page / total * 100) : 0;
    const audioUrl = audioSource(node);
    const previousNode = previousRouteNode(node);
    const previousNodeReadable = isReadable(previousNode);
    const previousNodeTitle = titleParts(previousNode).leaf;
    const previousNodeHint = previousNode
      ? (previousNodeReadable ? `返回上一節點：${previousNodeTitle}` : `上一節點尚未解鎖：${previousNodeTitle}`)
      : "已是第一個節點";
    const nextNode = nextRouteNode(node);
    const nextNodeReadable = isReadable(nextNode);
    const nextNodeTitle = titleParts(nextNode).leaf;
    const nextNodeHint = nextNode
      ? (nextNodeReadable ? `前往下一節點：${nextNodeTitle}` : `下一節點尚未解鎖：${nextNodeTitle}`)
      : "已是最後一個節點";
    const scopeNodes = readerScopeNodes(node);
    appMain.innerHTML = `<div class="page-wrap reader-page">
      <header class="reader-heading">
        <button type="button" class="reader-back" data-view="route" aria-label="返回學習路線">${iconMarkup("back")}</button>
        <div class="reader-title">
          <h1>${escapeHtml(title.leaf)}</h1>
          <p class="reader-page-index">${page} / ${total}</p>
        </div>
        <div class="reader-actions" aria-label="閱讀工具">
          <button type="button" class="reader-tool-button" id="audioButton" ${audioUrl ? "" : "disabled"}>${iconMarkup("volume")}<span>語音</span></button>
          <button type="button" class="reader-tool-button" id="fullscreenButton" ${isReadable(node) ? "" : "disabled"}>${iconMarkup("fullscreen")}<span>全螢幕</span></button>
          <button type="button" class="reader-tool-button" id="nodeInfoButton">${iconMarkup("info")}<span>資訊</span></button>
        </div>
      </header>
      ${audioUrl ? `<audio id="readerAudio" preload="none" src="${escapeHtml(audioUrl)}"></audio>` : ""}
      <div class="reader-node-switcher">
        <select class="reader-select" id="readerNodeSelect" aria-label="切換同月、同輪、同週、同章、同節的可閱讀節點">
          ${scopeNodes.map((candidate) => `<option value="${escapeHtml(candidate.id)}" ${candidate.id === node?.id ? "selected" : ""}>${escapeHtml(titleParts(candidate).leaf)}</option>`).join("")}
        </select>
        <span>同月 · 同輪 · 同週 · 同章 · 同節，共 <strong>${scopeNodes.length}</strong> 個可閱讀節點<br><small>${escapeHtml(readerScopeLabel(node))}</small></span>
      </div>
      <section class="card reader-shell">
        <div class="reader-stage" id="readerStage">
          <button type="button" class="reader-node-nav reader-previous-node" id="readerPreviousNode" data-open-node="${escapeHtml(previousNode?.id || "")}" aria-label="${escapeHtml(previousNodeHint)}" title="${escapeHtml(previousNodeHint)}" ${previousNodeReadable ? "" : "disabled"}>
            ${iconMarkup("back")}
          </button>
          ${isReadable(node) ? '<div class="reader-media-layer is-active"><img alt="閱讀頁面"></div><div class="reader-media-layer"><img alt="閱讀頁面"></div><div id="readerMessage" class="reader-message is-hidden">正在準備下一頁…</div>' : '<div class="reader-placeholder"><h2>這個節點尚未開放閱讀</h2><p>正式內容狀態與公開圖片解鎖是兩件事；必須有完整公開圖片才會開放閱讀。</p></div>'}
          <button type="button" class="reader-node-nav reader-next-node" id="readerNextNode" data-open-node="${escapeHtml(nextNode?.id || "")}" aria-label="${escapeHtml(nextNodeHint)}" title="${escapeHtml(nextNodeHint)}" ${nextNodeReadable ? "" : "disabled"}>
            ${iconMarkup("chevron")}
          </button>
        </div>
        <div class="reader-progress-line"><span id="readerProgressFill" style="width:${progress}%"></span><strong id="readerProgressPercent">${progress}%</strong></div>
        <footer class="reader-controls" aria-label="閱讀頁面控制">
          <button type="button" class="reader-directory" data-view="route" aria-label="返回目錄" title="返回目錄">${iconMarkup("catalog")}<span class="reader-control-label">目錄</span></button>
          <div class="reader-pager">
            <button type="button" id="readerPrevious" aria-label="上一頁" title="上一頁" ${page <= 1 ? "disabled" : ""}>${iconMarkup("back")}<span class="reader-control-label">上一頁</span></button>
            <span class="page-count" id="readerCounter">${page} / ${total}</span>
            <button type="button" id="readerNext" aria-label="下一頁" title="下一頁" ${page >= total ? "disabled" : ""}>${iconMarkup("chevron")}<span class="reader-control-label">下一頁</span></button>
          </div>
          <button type="button" class="reader-complete ${completed ? "is-complete" : ""}" id="completeButton" aria-label="${completed ? "取消已讀標記" : "標記已讀"}" title="${completed ? "取消已讀標記" : "標記已讀"}" aria-pressed="${completed}" ${isReadable(node) ? "" : "disabled"}>${iconMarkup("check")}<span class="reader-control-label">${completed ? "已讀" : "標記已讀"}</span></button>
        </footer>
      </section>
    </div>`;

    document.getElementById("readerPrevious")?.addEventListener("click", () => changeReaderPage(-1));
    document.getElementById("readerNext")?.addEventListener("click", () => changeReaderPage(1));
    document.getElementById("readerNodeSelect")?.addEventListener("change", (event) => openNode(event.currentTarget.value));
    document.getElementById("fullscreenButton")?.addEventListener("click", openFullscreen);
    const audio = document.getElementById("readerAudio");
    document.getElementById("audioButton")?.addEventListener("click", async (event) => {
      if (!audio) return;
      if (audio.paused) {
        try { await audio.play(); event.currentTarget.querySelector("span").textContent = "暫停"; } catch { /* 保留停用前的安全狀態 */ }
      } else {
        audio.pause();
        event.currentTarget.querySelector("span").textContent = "語音";
      }
    });
    document.getElementById("nodeInfoButton")?.addEventListener("click", (event) => openNodeInfo(node, event.currentTarget));
    document.getElementById("completeButton")?.addEventListener("click", () => {
      if (!node) return;
      const completed = !state.completed.includes(node.id);
      state.completed = completed ? [...state.completed, node.id] : state.completed.filter((id) => id !== node.id);
      if (completed) markRecentlyCompleted(node.id);
      else removeRecentlyCompleted(node.id);
      saveState();
      queueMutation("setNodeProgress", {
        nodeId: node.id,
        completed: completed ? "1" : "0",
        pageIndex: String(currentPage(node) - 1)
      });
      renderReader();
      setActiveNavigation();
    });
    readerActiveLayer = 0;
    if (isReadable(node)) loadReaderPage(page - 1, true);
  }

  function renderProgress() {
    const completed = state.completed.length;
    const readable = readableNodes.length;
    const qa = nodes.filter(hasQa).length;
    const review = nodes.filter((node) => node.contentReviewPass === true).length;
    const recentNodes = getRecentCompletedNodes(5);
    const percentage = readable ? Math.round(completed / readable * 100) : 0;
    appMain.innerHTML = `<div class="page-wrap">
      ${pageHeading("Learning Record", "進度", "個人閱讀紀錄與正式內容狀態分開計算，避免誤解。")}
      <section class="progress-grid">
        <div class="card progress-card">
          <h2>個人閱讀完成</h2>
          <div class="progress-number"><strong>${completed}</strong><span>/ ${readable} 個可閱讀節點</span></div>
          <div class="progress-track"><span style="width:${percentage}%"></span></div>
          <p class="progress-note">${percentage}% · ${IS_FORMAL ? "個人閱讀紀錄已連接正式雲端進度。" : "本預覽只使用本機儲存，不會修改正式雲端進度。"}</p>
        </div>
        <div class="card progress-card">
          <h2>正式內容狀態</h2>
          <div class="status-breakdown">
            <div class="status-line"><span>QA PASS</span><strong>${qa}</strong></div>
            <div class="status-line"><span>內容二審 PASS</span><strong>${review}</strong></div>
            <div class="status-line"><span>已有公開圖片</span><strong>${readable}</strong></div>
          </div>
        </div>
      </section>
      <section class="section-block">
        <div class="section-heading"><div><h2>最近閱讀</h2><p>依最近完成閱讀的節點排列，並保留頁次</p></div></div>
        <div class="compact-list">${recentNodes.length ? recentNodes.map(nodeRow).join("") : '<div class="card empty-state"><h2>還沒有閱讀完成紀錄</h2><p>將任一可閱讀節點標記為已讀後，這裡會顯示最近項目。</p></div>'}</div>
      </section>
    </div>`;
  }

  function renderSettings() {
    const settingsBody = IS_FORMAL
      ? `<section class="card settings-card"><h2>雲端閱讀進度</h2><p>個人頁次與已讀狀態會同步至正式雲端；離線時仍可繼續閱讀，恢復連線後可重新同步。</p><div class="button-row"><button type="button" class="secondary-button" id="syncNow">重新同步</button></div></section>`
      : `<section class="card settings-card"><h2>預覽資料</h2><p>目前的頁次、最近閱讀與「閱讀完畢」都只存在這台裝置的瀏覽器，不會呼叫正式 Apps Script，也不會改動 Google Sheet。</p></section>`;
    const resetBody = IS_FORMAL
      ? ""
      : `<section class="card settings-card"><h2>重設本機預覽</h2><p>清除這個 M3-A 預覽的個人頁次與完成紀錄，不會刪除正式資料。</p><div class="button-row"><button type="button" class="danger-button" id="resetPreview">清除預覽紀錄</button></div></section>`;
    appMain.innerHTML = `<div class="page-wrap">
      ${pageHeading("Preferences", "設定", IS_FORMAL ? "管理閱讀同步與全螢幕操作。" : "先清楚說明預覽邊界與閱讀操作，再決定是否正式上線。")}
      <div class="settings-grid">
        ${settingsBody}
        <section class="card settings-card"><h2>全螢幕閱讀操作</h2><ul class="contract-list"><li>在原分頁進入真正的瀏覽器全螢幕，關閉後回到同一節點與頁次。</li><li>初次顯示採整頁適配；滾輪、＋／−、雙指手勢皆可縮放。</li><li>放大後拖曳移動；100% 時左右滑動或方向鍵翻頁。</li><li>翻頁先載入並解碼下一張，成功後才交叉淡入；失敗保留原頁。</li></ul></section>
        ${resetBody}
      </div>
    </div>`;
    document.getElementById("syncNow")?.addEventListener("click", bootstrapCloudProgress);
    document.getElementById("resetPreview")?.addEventListener("click", () => {
      if (!window.confirm("確定清除 M3-A 本機預覽紀錄？正式 APP 與雲端資料不受影響。")) return;
      localStorage.removeItem(STORAGE_KEY);
      state = loadState();
      updateHash("replace");
      renderSettings();
      setActiveNavigation();
    });
  }

  function render() {
    if (state.view === "route") renderRoute();
    else if (state.view === "search") renderSearch();
    else if (state.view === "reader") renderReader();
    else if (state.view === "progress") renderProgress();
    else if (state.view === "settings") renderSettings();
    else renderHome();
    setActiveNavigation();
  }

  function imageReady(url, timeout = 12000) {
    return new Promise((resolve, reject) => {
      const image = new Image();
      const timer = window.setTimeout(() => reject(new Error("圖片載入逾時")), timeout);
      image.onload = async () => {
        try { if (image.decode) await image.decode(); } catch { /* 已載入即可顯示 */ }
        window.clearTimeout(timer);
        resolve(image);
      };
      image.onerror = () => {
        window.clearTimeout(timer);
        reject(new Error("圖片載入失敗"));
      };
      image.src = url;
    });
  }

  function prefetchNeighbors(node, index) {
    [index - 1, index + 1].forEach((candidate) => {
      const url = node?.images?.[candidate]?.url;
      if (!url) return;
      const image = new Image();
      image.src = url;
    });
  }

  async function loadReaderPage(index, initial = false) {
    const node = nodeById.get(state.selectedNodeId);
    if (!isReadable(node) || index < 0 || index >= node.images.length) return;
    const token = ++readerLoadToken;
    const layers = Array.from(document.querySelectorAll(".reader-media-layer"));
    if (layers.length !== 2) return;
    const targetLayerIndex = initial ? 0 : 1 - readerActiveLayer;
    const targetLayer = layers[targetLayerIndex];
    const message = document.getElementById("readerMessage");
    const loadingTimer = window.setTimeout(() => message?.classList.remove("is-hidden"), 300);
    try {
      const probe = await imageReady(node.images[index].url);
      if (token !== readerLoadToken) return;
      const image = targetLayer.querySelector("img");
      image.src = probe.src;
      image.alt = `${titleParts(node).leaf}，第 ${index + 1} 頁`;
      if (image.decode) { try { await image.decode(); } catch { /* cached image */ } }
      layers.forEach((layer, layerIndex) => layer.classList.toggle("is-active", layerIndex === targetLayerIndex));
      readerActiveLayer = targetLayerIndex;
      state.pages[node.id] = index + 1;
      saveState();
      if (!initial) queueMutation("setNodeProgress", {
        nodeId: node.id,
        completed: state.completed.includes(node.id) ? "1" : "0",
        pageIndex: String(index)
      });
      updateHash("replace");
      const counter = document.getElementById("readerCounter");
      if (counter) counter.textContent = `${index + 1} / ${node.images.length}`;
      const previous = document.getElementById("readerPrevious");
      const next = document.getElementById("readerNext");
      if (previous) previous.disabled = index <= 0;
      if (next) next.disabled = index >= node.images.length - 1;
      const pageIndex = document.querySelector(".reader-page-index");
      if (pageIndex) pageIndex.textContent = `${index + 1} / ${node.images.length}`;
      const progress = Math.round((index + 1) / node.images.length * 100);
      const progressFill = document.getElementById("readerProgressFill");
      const progressPercent = document.getElementById("readerProgressPercent");
      if (progressFill) progressFill.style.width = `${progress}%`;
      if (progressPercent) progressPercent.textContent = `${progress}%`;
      prefetchNeighbors(node, index);
    } catch (error) {
      if (!initial && message) {
        message.textContent = `${error.message}，已保留目前頁面`;
        message.classList.remove("is-hidden");
        window.setTimeout(() => { message.classList.add("is-hidden"); message.textContent = "正在準備下一頁…"; }, 2100);
      }
    } finally {
      window.clearTimeout(loadingTimer);
      if (message?.textContent === "正在準備下一頁…") message.classList.add("is-hidden");
    }
  }

  function changeReaderPage(delta) {
    const node = nodeById.get(state.selectedNodeId);
    if (!node) return;
    loadReaderPage(currentPage(node) - 1 + delta);
  }

  function fullscreenElement() {
    return document.fullscreenElement || document.webkitFullscreenElement || null;
  }

  async function openFullscreen() {
    const node = nodeById.get(state.selectedNodeId);
    if (!isReadable(node)) return;
    fsOpen = true;
    fsClosing = false;
    fsNode = node;
    fsPageIndex = currentPage(node) - 1;
    fsZoom = 1;
    fsPanX = 0;
    fsPanY = 0;
    fsReturnFocus = document.activeElement;
    fsTitle.textContent = titleParts(node).leaf;
    fsRoot.classList.remove("is-hidden");
    document.body.style.overflow = "hidden";

    const readerImage = document.querySelector(".reader-media-layer.is-active img");
    if (readerImage?.src) {
      const image = fsLayers[0].querySelector("img");
      image.src = readerImage.src;
      fsNaturalWidth = readerImage.naturalWidth || 1;
      fsNaturalHeight = readerImage.naturalHeight || 1;
      fsLayers.forEach((layer, index) => layer.classList.toggle("is-active", index === 0));
      fsActiveLayer = 0;
      requestAnimationFrame(layoutFullscreenImage);
    }

    const request = fsRoot.requestFullscreen || fsRoot.webkitRequestFullscreen;
    if (request) {
      try { await request.call(fsRoot, { navigationUI: "hide" }); } catch { fsRoot.classList.add("fullscreen-fallback"); }
    } else {
      fsRoot.classList.add("fullscreen-fallback");
    }
    await loadFullscreenPage(fsPageIndex, true);
  }

  async function closeFullscreen() {
    if (!fsOpen || fsClosing) return;
    fsClosing = true;
    const exit = document.exitFullscreen || document.webkitExitFullscreen;
    if (fullscreenElement() && exit) {
      try { await exit.call(document); } catch { /* fallback close below */ }
    }
    finishFullscreenClose();
  }

  function finishFullscreenClose() {
    if (!fsOpen) return;
    fsOpen = false;
    fsClosing = false;
    pointers.clear();
    gesture = null;
    fsRoot.classList.add("is-hidden");
    fsRoot.classList.remove("fullscreen-fallback");
    fsLoader.classList.add("is-hidden");
    document.body.style.overflow = "";
    if (fsNode) {
      state.pages[fsNode.id] = fsPageIndex + 1;
      saveState();
      updateHash("replace");
      if (state.view === "reader") loadReaderPage(fsPageIndex, true);
    }
    fsReturnFocus?.focus?.({ preventScroll: true });
  }

  async function loadFullscreenPage(index, initial = false) {
    if (!fsOpen || !fsNode || index < 0 || index >= fsNode.images.length) return;
    const token = ++fsLoadToken;
    const targetLayerIndex = initial && !fsLayers[fsActiveLayer].querySelector("img")?.src ? fsActiveLayer : 1 - fsActiveLayer;
    const targetLayer = fsLayers[targetLayerIndex];
    const loadingTimer = window.setTimeout(() => fsLoader.classList.remove("is-hidden"), 300);
    try {
      const probe = await imageReady(fsNode.images[index].url);
      if (token !== fsLoadToken || !fsOpen) return;
      const image = targetLayer.querySelector("img");
      image.src = probe.src;
      image.alt = `${titleParts(fsNode).leaf}，第 ${index + 1} 頁`;
      if (image.decode) { try { await image.decode(); } catch { /* cached image */ } }
      fsNaturalWidth = probe.naturalWidth || image.naturalWidth || 1;
      fsNaturalHeight = probe.naturalHeight || image.naturalHeight || 1;
      fsPageIndex = index;
      fsZoom = 1;
      fsPanX = 0;
      fsPanY = 0;
      layoutFullscreenImage(targetLayerIndex);
      requestAnimationFrame(() => {
        fsLayers.forEach((layer, layerIndex) => layer.classList.toggle("is-active", layerIndex === targetLayerIndex));
        fsActiveLayer = targetLayerIndex;
      });
      state.pages[fsNode.id] = index + 1;
      saveState();
      if (!initial) queueMutation("setNodeProgress", {
        nodeId: fsNode.id,
        completed: state.completed.includes(fsNode.id) ? "1" : "0",
        pageIndex: String(index)
      });
      updateHash("replace");
      updateFullscreenControls();
      prefetchNeighbors(fsNode, index);
    } catch (error) {
      fsLoader.textContent = `${error.message}，目前頁面仍保留`;
      fsLoader.classList.remove("is-hidden");
      window.setTimeout(() => { fsLoader.classList.add("is-hidden"); fsLoader.textContent = "正在準備下一頁…"; }, 2200);
    } finally {
      window.clearTimeout(loadingTimer);
      if (fsLoader.textContent === "正在準備下一頁…") fsLoader.classList.add("is-hidden");
    }
  }

  function changeFullscreenPage(delta) {
    loadFullscreenPage(fsPageIndex + delta);
  }

  function layoutFullscreenImage(layerIndex = fsActiveLayer) {
    if (!fsOpen) return;
    const rect = fsStage.getBoundingClientRect();
    const availableWidth = Math.max(rect.width - 28, 1);
    const availableHeight = Math.max(rect.height - 22, 1);
    fsFitScale = Math.min(availableWidth / fsNaturalWidth, availableHeight / fsNaturalHeight);
    clampPan();
    const layer = fsLayers[layerIndex];
    const image = layer?.querySelector("img");
    if (!image) return;
    image.style.width = `${fsNaturalWidth * fsFitScale * fsZoom}px`;
    image.style.height = `${fsNaturalHeight * fsFitScale * fsZoom}px`;
    image.style.transform = `translate(calc(-50% + ${fsPanX}px), calc(-50% + ${fsPanY}px))`;
    zoomReset.textContent = `${Math.round(fsZoom * 100)}%`;
  }

  function clampPan() {
    const rect = fsStage.getBoundingClientRect();
    const width = fsNaturalWidth * fsFitScale * fsZoom;
    const height = fsNaturalHeight * fsFitScale * fsZoom;
    const maxX = Math.max(0, (width - rect.width) / 2 + 20);
    const maxY = Math.max(0, (height - rect.height) / 2 + 20);
    fsPanX = Math.min(Math.max(fsPanX, -maxX), maxX);
    fsPanY = Math.min(Math.max(fsPanY, -maxY), maxY);
  }

  function setFullscreenZoom(value) {
    const next = Math.min(Math.max(value, 1), 3);
    fsZoom = next;
    if (fsZoom === 1) { fsPanX = 0; fsPanY = 0; }
    layoutFullscreenImage();
  }

  function stepFullscreenZoom(direction) {
    let index = ZOOM_STEPS.findIndex((value) => Math.abs(value - fsZoom) < .01);
    if (index < 0) index = ZOOM_STEPS.reduce((best, value, candidate) => Math.abs(value - fsZoom) < Math.abs(ZOOM_STEPS[best] - fsZoom) ? candidate : best, 0);
    setFullscreenZoom(ZOOM_STEPS[Math.min(Math.max(index + direction, 0), ZOOM_STEPS.length - 1)]);
  }

  function updateFullscreenControls() {
    fsCounter.textContent = `${fsPageIndex + 1} / ${fsNode?.images?.length || 0}`;
    for (const id of ["fsPrevTop", "fsPrevEdge"]) document.getElementById(id).disabled = fsPageIndex <= 0;
    for (const id of ["fsNextTop", "fsNextEdge"]) document.getElementById(id).disabled = fsPageIndex >= (fsNode?.images?.length || 0) - 1;
    zoomReset.textContent = `${Math.round(fsZoom * 100)}%`;
  }

  function pointerDistance() {
    const values = Array.from(pointers.values());
    if (values.length < 2) return 0;
    return Math.hypot(values[0].x - values[1].x, values[0].y - values[1].y);
  }

  document.addEventListener("click", (event) => {
    const viewButton = event.target.closest("[data-view]");
    if (viewButton) { navigate(viewButton.dataset.view); return; }
    const nodeButton = event.target.closest("[data-open-node]");
    if (nodeButton && !nodeButton.disabled) {
      const node = nodeById.get(nodeButton.dataset.openNode);
      if (isReadable(node)) openNode(node.id);
      else if (nodeButton.dataset.nodeBehavior === "read-or-info") openNodeInfo(node, nodeButton);
    }
  });

  sideNav?.addEventListener("keydown", (event) => {
    if (event.key !== "ArrowDown" && event.key !== "ArrowUp") return;
    const buttons = Array.from(sideNav.querySelectorAll("button"));
    const index = buttons.indexOf(document.activeElement);
    buttons[(index + (event.key === "ArrowDown" ? 1 : -1) + buttons.length) % buttons.length]?.focus();
    event.preventDefault();
  });

  document.getElementById("fsClose").addEventListener("click", closeFullscreen);
  document.getElementById("fsPrevTop").addEventListener("click", () => changeFullscreenPage(-1));
  document.getElementById("fsNextTop").addEventListener("click", () => changeFullscreenPage(1));
  document.getElementById("fsPrevEdge").addEventListener("click", () => changeFullscreenPage(-1));
  document.getElementById("fsNextEdge").addEventListener("click", () => changeFullscreenPage(1));
  document.getElementById("zoomOut").addEventListener("click", () => stepFullscreenZoom(-1));
  document.getElementById("zoomIn").addEventListener("click", () => stepFullscreenZoom(1));
  zoomReset.addEventListener("click", () => setFullscreenZoom(1));

  fsStage.addEventListener("wheel", (event) => {
    if (!fsOpen) return;
    event.preventDefault();
    wheelAccumulator += event.deltaY;
    if (Math.abs(wheelAccumulator) < 24) return;
    stepFullscreenZoom(wheelAccumulator > 0 ? -1 : 1);
    wheelAccumulator = 0;
  }, { passive: false });

  fsStage.addEventListener("pointerdown", (event) => {
    fsStage.setPointerCapture?.(event.pointerId);
    pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
    if (pointers.size === 1) {
      gesture = { startX: event.clientX, startY: event.clientY, lastX: event.clientX, lastY: event.clientY, startedAt: performance.now(), panX: fsPanX, panY: fsPanY };
      fsStage.classList.add("is-dragging");
    } else if (pointers.size === 2) {
      gesture = { pinchDistance: pointerDistance(), pinchZoom: fsZoom };
    }
  });

  fsStage.addEventListener("pointermove", (event) => {
    if (!pointers.has(event.pointerId)) return;
    pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
    if (pointers.size === 2 && gesture?.pinchDistance) {
      setFullscreenZoom(gesture.pinchZoom * pointerDistance() / gesture.pinchDistance);
      return;
    }
    if (pointers.size === 1 && gesture && fsZoom > 1) {
      fsPanX = gesture.panX + event.clientX - gesture.startX;
      fsPanY = gesture.panY + event.clientY - gesture.startY;
      gesture.lastX = event.clientX;
      gesture.lastY = event.clientY;
      layoutFullscreenImage();
    } else if (pointers.size === 1 && gesture) {
      gesture.lastX = event.clientX;
      gesture.lastY = event.clientY;
    }
  });

  function endPointer(event) {
    const lastGesture = gesture;
    pointers.delete(event.pointerId);
    fsStage.releasePointerCapture?.(event.pointerId);
    if (pointers.size === 0) {
      fsStage.classList.remove("is-dragging");
      if (lastGesture?.startX != null && fsZoom === 1) {
        const dx = (lastGesture.lastX ?? event.clientX) - lastGesture.startX;
        const dy = (lastGesture.lastY ?? event.clientY) - lastGesture.startY;
        const elapsed = performance.now() - lastGesture.startedAt;
        if (Math.abs(dx) >= 48 && Math.abs(dx) > Math.abs(dy) * 1.25 && elapsed <= 600) changeFullscreenPage(dx < 0 ? 1 : -1);
      }
      gesture = null;
    } else if (pointers.size === 1) {
      const remaining = Array.from(pointers.values())[0];
      gesture = { startX: remaining.x, startY: remaining.y, lastX: remaining.x, lastY: remaining.y, startedAt: performance.now(), panX: fsPanX, panY: fsPanY };
    }
  }
  fsStage.addEventListener("pointerup", endPointer);
  fsStage.addEventListener("pointercancel", endPointer);

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
      const infoBackdrop = document.getElementById("nodeInfoBackdrop");
      if (infoBackdrop && !infoBackdrop.classList.contains("is-hidden")) {
        closeNodeInfo();
        return;
      }
    }
    if (!fsOpen) return;
    if (event.key === "Escape") { closeFullscreen(); return; }
    if (event.key === "ArrowLeft") changeFullscreenPage(-1);
    else if (event.key === "ArrowRight") changeFullscreenPage(1);
    else if (event.key === "+" || event.key === "=") stepFullscreenZoom(1);
    else if (event.key === "-") stepFullscreenZoom(-1);
    else if (event.key === "0") setFullscreenZoom(1);
  });

  document.addEventListener("fullscreenchange", () => {
    if (fsOpen && !fullscreenElement() && !fsClosing) finishFullscreenClose();
    else if (fsOpen) requestAnimationFrame(layoutFullscreenImage);
  });
  document.addEventListener("webkitfullscreenchange", () => {
    if (fsOpen && !fullscreenElement() && !fsClosing) finishFullscreenClose();
  });
  window.addEventListener("resize", () => { if (fsOpen) layoutFullscreenImage(); });
  if ("scrollRestoration" in history) history.scrollRestoration = "manual";
  window.addEventListener("popstate", () => { applyHash(); render(); resetViewScroll(); });

  applyHash();
  saveState();
  updateHash("replace");
  render();
  if (IS_FORMAL) bootstrapCloudProgress();
})();

  </script>
</body>
</html>
